<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="今日清单">
  <meta name="theme-color" content="#f7f5f0">
  <title>今日清单</title>
  <style>
    :root{
      --bg:#f7f5f0;
      --text:#202124;
      --muted:#97958f;
      --line:rgba(32,33,36,.16);
      --soft:rgba(32,33,36,.05);
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;width:100%;height:100%;
      background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif;
      -webkit-tap-highlight-color:transparent;
    }
    body{
      padding:max(18px,env(safe-area-inset-top))
              max(20px,env(safe-area-inset-right))
              max(22px,env(safe-area-inset-bottom))
              max(20px,env(safe-area-inset-left));
    }
    .app{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
    header{display:flex;align-items:flex-end;justify-content:space-between;padding:12px 2px 22px}
    h1{font-size:30px;line-height:1;margin:0;font-weight:720;letter-spacing:-.04em}
    .date{font-size:13px;color:var(--muted);padding-bottom:2px}
    .sections{display:flex;flex-direction:column;gap:24px}
    section{border-top:1px solid var(--line);padding-top:15px}
    .section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
    h2{font-size:13px;letter-spacing:.12em;margin:0;color:#77756f;font-weight:750}
    .count{font-size:11px;color:var(--muted)}
    .row{
      min-height:62px;display:grid;grid-template-columns:30px 1fr 34px;
      align-items:center;border-bottom:1px solid var(--line);gap:8px;
    }
    .check{
      width:22px;height:22px;border:1.5px solid #aaa79f;border-radius:50%;
      background:transparent;display:grid;place-items:center;padding:0;cursor:pointer;
    }
    .check::after{
      content:"";width:9px;height:5px;border-left:2px solid var(--bg);
      border-bottom:2px solid var(--bg);transform:rotate(-45deg) translateY(-1px);
      opacity:0;
    }
    .row.done .check{background:var(--text);border-color:var(--text)}
    .row.done .check::after{opacity:1}
    input{
      min-width:0;width:100%;border:0;outline:0;background:transparent;
      color:var(--text);font:inherit;font-size:16px;padding:18px 0;
    }
    input::placeholder{color:#b9b6af}
    .row.done input{text-decoration:line-through;color:var(--muted)}
    .delete{
      border:0;background:transparent;color:#b1aea7;font-size:23px;
      line-height:1;padding:5px;cursor:pointer;opacity:.7;
    }
    .delete:active{transform:scale(.9)}
    footer{
      margin-top:auto;text-align:center;color:var(--muted);
      font-size:11px;padding:28px 0 5px;
    }
    .toast{
      position:fixed;left:50%;bottom:max(32px,env(safe-area-inset-bottom));
      transform:translateX(-50%) translateY(20px);
      background:#202124;color:white;padding:9px 14px;border-radius:999px;
      font-size:12px;opacity:0;pointer-events:none;transition:.22s;
    }
    .toast.show{opacity:.92;transform:translateX(-50%) translateY(0)}
    @media(prefers-color-scheme:dark){
      :root{
        --bg:#111315;--text:#f2f2f0;--muted:#85888c;
        --line:rgba(255,255,255,.15);--soft:rgba(255,255,255,.05);
      }
      input::placeholder{color:#55595e}
      .check{border-color:#777b80}
      .row.done .check{background:#f2f2f0;border-color:#f2f2f0}
      .row.done .check::after{border-color:#111315}
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>今日清单</h1>
      <div class="date" id="date"></div>
    </header>

    <div class="sections">
      <section data-section="today">
        <div class="section-head">
          <h2>今天要做</h2><span class="count"></span>
        </div>
        <div class="rows"></div>
      </section>

      <section data-section="must">
        <div class="section-head">
          <h2>MUST DOS</h2><span class="count"></span>
        </div>
        <div class="rows"></div>
      </section>

      <section data-section="problems">
        <div class="section-head">
          <h2>要解决的问题</h2><span class="count"></span>
        </div>
        <div class="rows"></div>
      </section>
    </div>

    <footer>内容按当天自动保存</footer>
  </main>
  <div class="toast" id="toast">已删除</div>

<script>
  const today = new Date();
  const dateKey = [
    today.getFullYear(),
    String(today.getMonth()+1).padStart(2,"0"),
    String(today.getDate()).padStart(2,"0")
  ].join("-");
  document.getElementById("date").textContent =
    `${today.getMonth()+1}月${today.getDate()}日 · ${["周日","周一","周二","周三","周四","周五","周六"][today.getDay()]}`;

  const STORE = "daily-todo-" + dateKey;
  const defaultData = {
    today: Array.from({length:3},()=>({text:"",done:false})),
    must: Array.from({length:3},()=>({text:"",done:false})),
    problems: Array.from({length:3},()=>({text:"",done:false}))
  };
  let data;
  try { data = JSON.parse(localStorage.getItem(STORE)) || defaultData; }
  catch { data = defaultData; }

  function save(){ localStorage.setItem(STORE, JSON.stringify(data)); }

  const placeholders = {
    today:["今天最值得完成的事","今天要推进的事","今天不能忘记的事"],
    must:["必须完成 1","必须完成 2","必须完成 3"],
    problems:["需要解决的问题 1","需要解决的问题 2","需要解决的问题 3"]
  };

  function renderSection(sectionName){
    const section = document.querySelector(`[data-section="${sectionName}"]`);
    const rows = section.querySelector(".rows");
    rows.innerHTML = "";
    data[sectionName].forEach((item,index)=>{
      const row = document.createElement("div");
      row.className = "row" + (item.done ? " done" : "");

      const check = document.createElement("button");
      check.className = "check";
      check.setAttribute("aria-label","完成");
      check.onclick = ()=>{
        item.done = !item.done;
        save(); renderSection(sectionName);
      };

      const input = document.createElement("input");
      input.value = item.text;
      input.placeholder = placeholders[sectionName][index];
      input.maxLength = 80;
      input.oninput = ()=>{ item.text = input.value; save(); };

      const del = document.createElement("button");
      del.className = "delete";
      del.textContent = "×";
      del.setAttribute("aria-label","删除");
      del.onclick = ()=>{
        item.text = ""; item.done = false; save();
        renderSection(sectionName); showToast();
      };

      row.append(check,input,del);
      rows.appendChild(row);
    });
    const completed = data[sectionName].filter(x=>x.done).length;
    section.querySelector(".count").textContent = `${completed}/3`;
  }

  function showToast(){
    const t=document.getElementById("toast");
    t.classList.add("show");
    setTimeout(()=>t.classList.remove("show"),900);
  }

  ["today","must","problems"].forEach(renderSection);
</script>
</body>
</html>
